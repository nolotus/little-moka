<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8ec"><title>Little Moka · 一杯一小步</title><meta name="description" content="温暖的手绘动画，陪你一步一步做出喜欢的饮品。"><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="./"><span>✳</span> little moka</a><span class="motto">一杯一小步，好好过今天。</span><button id="sound" class="sound-button" aria-pressed="true" aria-label="关闭音效">♪ 音效开</button><button id="choose" class="outline">换一杯 ↗</button></header>
<main id="welcome"><div class="intro"><span class="eyebrow">YOUR LITTLE COFFEE BREAK</span><h1>今天，想喝点什么？</h1><p>跟着小动画，在自己的节奏里做一杯。</p></div><div id="recipeCards" class="cards"></div><button id="resume" class="primary" hidden>继续上次那一杯 →</button><p class="footnote">不赶时间。准备好，再开始。 ✿</p></main>
<main id="ritual" hidden><div class="chapter"><span id="recipeName"></span><span id="stepCount"></span></div><div class="progress"><i id="bar"></i></div><section class="workspace"><div class="viewer"><div class="stage-badge"><span class="mascot" aria-hidden="true">☕</span><span id="stageCue">跟我一起做</span></div><div class="stage-decor" aria-hidden="true"><span>✦</span><span>✧</span><span>✿</span></div><div id="scene" role="img"></div><button id="replay" class="text-button">↻ 重看演示</button></div><div class="copy"><div class="task-header"><span class="task-number" id="taskNumber">01</span><span id="stepLabel">这一小步</span><span class="task-star" aria-hidden="true">✦</span></div><h1 id="title"></h1><p id="description"></p><div class="tip"><span class="tip-icon" aria-hidden="true">!</span><span id="tip"></span></div><div id="timer" hidden><div class="timer-row"><strong id="clock" role="timer">00:30</strong><span id="timerStatus">等你实际操作好再开始</span></div><button id="timerStart" class="outline"></button></div><div class="amounts" id="amounts"></div></div></section><footer class="navigation"><button id="back" class="text-button">← 回看</button><span id="reviewNote"></span><button id="next" class="primary">做好了，下一步 →</button></footer></main>
<main id="finish" hidden><div class="finish-icon">✳</div><div class="finish-stamp">今日小小成就 ✓</div><span class="eyebrow">A LITTLE MOMENT, WELL MADE</span><h1>这一杯，是你做的。</h1><p id="finishText"></p><p>让香气留一会儿，慢慢喝。</p><button id="another" class="primary">下一次，再来一杯 ↗</button></main>
<dialog id="setup"><form id="configForm"><div class="dialog-title"><div><span class="eyebrow">MAKE IT YOURS</span><h2 id="setupTitle"></h2></div><button type="button" id="close" class="text-button" aria-label="关闭">×</button></div><p id="equipment"></p><label for="target">这一杯的目标量 <output id="targetValue"></output></label><input type="range" id="target" step="10"><p class="hint" id="volumeHint"></p><label for="capacity">你的杯子容量（ml）</label><input type="number" id="capacity" min="150" max="1000" step="10" value="350" required><div id="doseField"><label for="dose">你的摩卡壶满篮粉重（g）</label><input type="number" id="dose" min="5" max="40" step="0.5" value="16" required><p class="hint">按壶的实际粉篮填写，不随杯量缩放；加水至安全阀下方。默认入杯咖啡 60ml，需保证实际出液足够。</p></div><label class="check"><input type="checkbox" id="preground"> 我用现成咖啡粉，跳过磨豆</label><div class="summary" id="summary"></div><p id="error" role="alert"></p><button id="start" class="primary wide">准备好了，开始制作 →</button><p class="hint">新开一杯会替换本机保存的制作进度。</p></form></dialog>
<div id="stepFeedback" role="status" aria-live="polite"></div><script type="module" src="app.js"></script></body></html>
